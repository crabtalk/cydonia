<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Cydonia, in the browser</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				overflow: hidden;
				width: 100vw;
				height: 100vh;
				background: #fff;
			}

			@media (prefers-color-scheme: dark) {
				body {
					background: #0b0b0c;
				}
			}

			/* Out of flow: gpui sizes its canvas `100%` and appends it to the
			   body, and in normal flow the two would size each other. */
			body > canvas {
				position: fixed;
				inset: 0;
				display: block;
				width: 100%;
				height: 100%;
			}

			#boot {
				position: fixed;
				z-index: 1;
				pointer-events: none;
				top: 50%;
				left: 50%;
				display: grid;
				justify-items: center;
				gap: 12px;
				transform: translate(-50%, -50%);
				color: #8b8f96;
				font: 13px -apple-system, system-ui, sans-serif;
			}

			#bar {
				width: 180px;
				height: 2px;
				overflow: hidden;
				background: #e6e6e6;
			}

			#fill {
				width: 0;
				height: 100%;
				background: #0b0b0c;
				transition: width 0.15s;
			}

			@media (prefers-color-scheme: dark) {
				#bar {
					background: #26262a;
				}

				#fill {
					background: #f2f2f3;
				}
			}
		</style>
	</head>
	<body>
		<div id="boot">
			<div id="bar"><div id="fill"></div></div>
			<p id="status">Loading Cydonia…</p>
		</div>
		<script type="module">
			import init from './cydonia_demo.js';

			// The wasm's size before compression, for the bar where the response
			// is compressed and names no length. stamp-demo.mjs writes it at build.
			const WASM = './cydonia_demo_bg.wasm';
			const WASM_BYTES = 0;

			const fill = document.getElementById('fill');
			const status = document.getElementById('status');

			// The download, counted as it arrives. Handed to init as bytes, which
			// also keeps WebKit off streaming compilation.
			async function download() {
				const response = await fetch(WASM);
				if (!response.ok) throw new Error(`${response.status} fetching the app`);
				const named = Number(response.headers.get('content-length'));
				const total = response.headers.get('content-encoding') ? WASM_BYTES : named || WASM_BYTES;
				const reader = response.body.getReader();
				const chunks = [];
				let got = 0;
				for (;;) {
					const { done, value } = await reader.read();
					if (done) break;
					chunks.push(value);
					got += value.length;
					if (total) fill.style.width = `${Math.min(100, (got / total) * 100)}%`;
				}
				fill.style.width = '100%';
				status.textContent = 'Starting Cydonia…';
				return new Blob(chunks).arrayBuffer();
			}

			download()
				.then((bytes) => init({ module_or_path: bytes }))
				.then(() => document.getElementById('boot')?.remove())
				.catch((error) => {
					// A panic has already written its own message here.
					const boot = document.getElementById('boot');
					if (boot && !boot.textContent.startsWith('Cydonia did not start'))
						boot.textContent = `Cydonia did not start: ${error?.message ?? error}`;
					console.error(error);
				});
		</script>
	</body>
</html>
