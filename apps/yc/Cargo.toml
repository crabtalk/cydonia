[package]
name = "yc"
description = "The Y Combinator directory: companies from yc-oss and their founders, in tables of its own"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[package.metadata.cydonia]
name = "Y Combinator"
calls = ["tables"]
hosts = ["yc-oss.github.io", "www.ycombinator.com", "bookface-images.s3.amazonaws.com"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cydonia-guest = { path = "../../crates/guest" }
serde_json.workspace = true
