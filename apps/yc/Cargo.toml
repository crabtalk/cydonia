[package]
name = "yc"
description = "The Y Combinator directory: companies from yc-oss and their founders, in project tables"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata.cydonia]
name = "Y Combinator"
calls = ["tables"]
hosts = ["yc-oss.github.io", "www.ycombinator.com", "bookface-images.s3.amazonaws.com"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cydonia-guest = { path = "../../crates/guest" }
serde_json = "1"

[workspace]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
