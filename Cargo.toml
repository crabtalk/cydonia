[workspace]
members = ["acp/*", "apps/*", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.4"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/crabtalk/cydonia"
homepage = "https://cydonia.sh"

[workspace.dependencies]
cydonia-acp = { version = "0.2.0", path = "acp/acp", default-features = false }
cydonia-acp-agents = { version = "0.2.0", path = "acp/agents", default-features = false }
cydonia-acp-events = { version = "0.2.0", path = "acp/events" }
cydonia-acp-proto = { version = "0.2.0", path = "acp/proto" }
artifact = { version = "0.2.0", path = "crates/artifact", package = "cydonia-artifact", default-features = false }
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bezel = "0.2.19"
browser = { version = "0.2.19", package = "bezel-browser", features = ["inspector"] }
chrono = "0.4"
dirs = "6"
editor = { version = "0.2.19", package = "bezel-editor" }
futures = "0.3"
guest = { version = "0.2.0", path = "crates/guest", package = "cydonia-guest" }
guest-macros = { version = "0.2.0", path = "crates/guest-macros", package = "cydonia-guest-macros" }
gui = { version = "0.2.0", path = "crates/gui", package = "cydonia-gui", default-features = false }
global-hotkey = "0.8"
image = "0.25"
lru = "0.18"
manifest = { version = "0.2.0", path = "crates/manifest", package = "cydonia-manifest" }
markdown = { version = "0.2.19", package = "bezel-markdown", features = ["mermaid"] }
mcp = { version = "0.2.0", path = "crates/mcp", package = "cydonia-mcp", default-features = false }
notify = "8"
portable-pty = "0.9"
process-wrap = { version = "10", default-features = false, features = ["std", "process-group", "job-object"] }
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
thiserror = "2"
syntax = { version = "0.2.19", package = "bezel-syntax", features = ["wasm"] }
prompts = { version = "0.2.0", path = "crates/prompts", package = "cydonia-prompts" }
terminal = { version = "0.2.19", package = "bezel-terminal" }
tokio = "1"
toml = "0.8"
toml_edit = "0.22"
unicode-segmentation = "1"
ureq = "3"
url = { version = "2", features = ["serde"] }
web-time = "1"
which = "8"

[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
