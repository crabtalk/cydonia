[workspace]
members = ["crates/cydonia", "crates/gui", "crates/demo", "crates/artifact", "crates/mcp", "crates/prompts"]
resolver = "3"

[workspace.package]
version = "0.1.27"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/crabtalk/cydonia"
homepage = "https://cydonia.sh"

[workspace.dependencies]
artifact = { version = "0.1.16", path = "crates/artifact", package = "cydonia-artifact", default-features = false }
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bezel = "0.2.9"
browser = { version = "0.2.9", package = "bezel-browser", features = ["inspector"] }
cacp = { version = "0.1.3", default-features = false }
cacp-agents = { version = "0.1.3", default-features = false }
chrono = "0.4"
dirs = "6"
editor = { version = "0.2.9", package = "bezel-editor" }
futures = "0.3"
gui = { version = "0.1.16", path = "crates/gui", package = "cydonia-gui", default-features = false }
global-hotkey = "0.8"
image = "0.25"
lru = "0.18"
markdown = { version = "0.2.9", package = "bezel-markdown", features = ["mermaid"] }
mcp = { version = "0.1.16", path = "crates/mcp", package = "cydonia-mcp", default-features = false }
notify = "8"
portable-pty = "0.9"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syntax = { version = "0.2.9", package = "bezel-syntax", features = ["wasm"] }
prompts = { version = "0.1.16", path = "crates/prompts", package = "cydonia-prompts" }
terminal = { version = "0.2.9", package = "bezel-terminal" }
tokio = { version = "1", features = ["net", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
toml_edit = "0.22"
ureq = "3"
url = { version = "2", features = ["serde"] }
web-time = "1"

[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"


[patch.crates-io]
bezel = { path = "../bezel/crates/bezel" }
bezel-agent = { path = "../bezel/crates/agent" }
bezel-browser = { path = "../bezel/crates/browser" }
bezel-canvas-core = { path = "../bezel/crates/canvas-core" }
bezel-editor = { path = "../bezel/crates/editor" }
bezel-icons = { path = "../bezel/crates/icons" }
bezel-markdown = { path = "../bezel/crates/markdown" }
bezel-motion = { path = "../bezel/crates/motion" }
bezel-syntax = { path = "../bezel/crates/syntax" }
bezel-syntax-std = { path = "../bezel/crates/syntax-std" }
bezel-terminal = { path = "../bezel/crates/terminal" }
bezel-theme = { path = "../bezel/crates/theme" }
bezel-ui = { path = "../bezel/crates/ui" }
bezel-zed-collections = { path = "../zed/crates/collections" }
bezel-gpui = { path = "../zed/crates/gpui" }
bezel-gpui-apple = { path = "../zed/crates/gpui_apple" }
bezel-gpui-linux = { path = "../zed/crates/gpui_linux" }
bezel-gpui-macos = { path = "../zed/crates/gpui_macos" }
bezel-gpui-macros = { path = "../zed/crates/gpui_macros" }
bezel-gpui-platform = { path = "../zed/crates/gpui_platform" }
bezel-gpui-shared-string = { path = "../zed/crates/gpui_shared_string" }
bezel-gpui-util = { path = "../zed/crates/gpui_util" }
bezel-gpui-web = { path = "../zed/crates/gpui_web" }
bezel-gpui-wgpu = { path = "../zed/crates/gpui_wgpu" }
bezel-gpui-windows = { path = "../zed/crates/gpui_windows" }
bezel-zed-http-client = { path = "../zed/crates/http_client" }
bezel-zed-http-client-tls = { path = "../zed/crates/http_client_tls" }
bezel-zed-path = { path = "../zed/crates/path" }
bezel-zed-perf = { path = "../zed/tooling/perf" }
bezel-zed-refineable = { path = "../zed/crates/refineable" }
bezel-zed-reqwest-client = { path = "../zed/crates/reqwest_client" }
bezel-zed-scheduler = { path = "../zed/crates/scheduler" }
bezel-zed-sum-tree = { path = "../zed/crates/sum_tree" }
bezel-zed-util-macros = { path = "../zed/crates/util_macros" }
bezel-zed-zlog = { path = "../zed/crates/zlog" }
bezel-zed-ztracing = { path = "../zed/crates/ztracing" }
bezel-zed-ztracing-macro = { path = "../zed/crates/ztracing_macro" }
bezel-zed-derive-refineable = { path = "../zed/crates/refineable/derive_refineable" }
