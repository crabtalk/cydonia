[workspace]
resolver = "3"
members = ["crates/core", "crates/registry", "apps/tui", "apps/gpui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/crabtalk/cydonia"

[workspace.dependencies]
cydonia-core = { path = "crates/core" }
cydonia-registry = { path = "crates/registry" }

# crates.io
agent-client-protocol = "2.0"
anyhow = "1"
crossterm = { version = "0.28", features = ["event-stream"] }
diffy = "0.4"
dirs = "6"
futures = "0.3"
futures-util = "0.3"
gpui = "0.2"
pulldown-cmark = "0.13"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
termimad = "0.34"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "0.8"
ureq = { version = "3", features = ["json"] }
