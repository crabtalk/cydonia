[package]
name = "cydonia"
description = "Desktop client for ACP agents"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/crabtalk/cydonia"
readme = "README.md"

[[bin]]
name = "cydonia"
path = "bin/main.rs"

[dependencies]
# bezel — the component library the GUI is built on. Published as `bezel-*`;
# the keys here are what the source imports. `platform` carries gpui_platform,
# which opens the window: gpui core knows no platform of its own.
bezel = { version = "0.1.5", features = ["platform"] }
editor = { version = "0.1.5", package = "bezel-editor" }
markdown = { version = "0.1.5", package = "bezel-markdown" }
syntax = { version = "0.1.5", package = "bezel-syntax" }

# cacp — our ACP implementation, taken from the registry like any other
# dependency now that it is published and settled.
cacp = { version = "0.1.0", default-features = false, features = ["client"] }
cacp-agents = "0.1.0"

# crates.io
anyhow = "1"
dirs = "6"
# `Shared`, which is the task an in-flight cover is held as. gpui builds its own
# image cache on it and compiles the crate either way, so this names what is
# already in the graph rather than adding to it.
futures = "0.3"
# Resizes a picked cover on the way in. Already in the graph — gpui decodes
# every image it paints with it — so this names a crate that is compiled either
# way rather than adding one.
image = "0.25"
# The cover cache's recency list. Zero dependencies of its own — the whole
# crate is the map and the order, which is exactly what is missing from gpui's
# own asset cache.
lru = "0.18"
# The project database. `bundled` compiles SQLite in: the store is a file we
# hand to the user, so it cannot depend on whichever sqlite3 a machine ships.
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# An archived transcript is an array of tagged enum variants, which is the one
# shape `toml` cannot round-trip.
serde_json = "1"
# cacp spawns its read and write loops with `tokio::spawn`, so the connection
# needs a runtime of its own — gpui's executor is smol's.
tokio = { version = "1", features = ["process", "rt-multi-thread", "sync"] }
toml = "0.8"
# Installing an agent edits settings.toml in place. `toml` would round-trip
# it through a value tree and drop every comment the file was written with.
toml_edit = "0.22"
# Downloads the registry's agent icons. The same client cacp-agents fetches
# the catalog with, so this adds no second HTTP stack.
ureq = "3"

# bezel still moves with this app, so it is built from the checkout beside it
# rather than from whatever was last published. The dependencies above stay
# version requirements — this table only says where those versions are read
# from, so removing it builds the same manifest against crates.io.
#
# Only the crates cydonia names itself are listed. Each path-depends on the rest
# of the bezel workspace, so the sibling crates follow without being named — and
# naming one that is only reached transitively would leave two copies of it in
# the graph, which is a type from one not fitting the other.
[patch.crates-io]
bezel = { path = "../bezel/crates/bezel" }
bezel-editor = { path = "../bezel/crates/editor" }
bezel-markdown = { path = "../bezel/crates/markdown" }
bezel-syntax = { path = "../bezel/crates/syntax" }
