[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/crabtalk/cydonia"

[workspace.dependencies]
# bezel — the component library the GUI is built on. Published as `bezel-*`;
# the keys here are what the source imports. `platform` carries gpui_platform,
# which opens the window: gpui core knows no platform of its own.
bezel = { version = "0.1.3", features = ["platform"] }
editor = { version = "0.1.3", package = "bezel-editor" }
markdown = { version = "0.1.3", package = "bezel-markdown" }
syntax = { version = "0.1.3", package = "bezel-syntax" }

# cacp — our ACP implementation. A sibling checkout while both move together.
cacp = { path = "../cacp/crates/cacp", default-features = false, features = [
    "client",
] }
cacp-agents = { path = "../cacp/crates/agents" }
ui = { path = "crates/ui", package = "cydonia-ui" }

# crates.io
anyhow = "1"
dirs = "6"
serde = { version = "1", features = ["derive"] }
# An archived transcript is an array of tagged enum variants, which is the one
# shape `toml` cannot round-trip.
serde_json = "1"
# cacp spawns its read and write loops with `tokio::spawn`, so the connection
# needs a runtime of its own — gpui's executor is smol's.
tokio = { version = "1", features = ["process", "rt-multi-thread", "sync"] }
toml = "0.8"
# Installing an agent edits settings.toml in place. `toml` would round-trip
# it through a value tree and drop every comment the file was written with.
toml_edit = "0.22"
# Downloads the registry's agent icons. The same client cacp-agents fetches
# the catalog with, so this adds no second HTTP stack.
ureq = "3"

# bezel is being fixed in a worktree beside this checkout. Every bezel-* crate
# in the graph has to come from there together: two copies of the token system
# is a second type universe, and the window paints shapes but no text.
[patch.crates-io]
bezel = { path = "../bezel-editor-fix/crates/bezel" }
bezel-agent = { path = "../bezel-editor-fix/crates/agent" }
bezel-editor = { path = "../bezel-editor-fix/crates/editor" }
bezel-markdown = { path = "../bezel-editor-fix/crates/markdown" }
bezel-motion = { path = "../bezel-editor-fix/crates/motion" }
bezel-syntax = { path = "../bezel-editor-fix/crates/syntax" }
bezel-theme = { path = "../bezel-editor-fix/crates/theme" }
bezel-ui = { path = "../bezel-editor-fix/crates/ui" }
