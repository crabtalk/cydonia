[workspace]
members = ["crates/cydonia", "crates/artifact", "crates/mcp", "crates/prompts"]
resolver = "3"

[workspace.package]
version = "0.1.12"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/crabtalk/cydonia"
homepage = "https://cydonia.sh"

[workspace.dependencies]
artifact = { version = "0.1.12", path = "crates/artifact", package = "cydonia-artifact" }
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bezel = { version = "0.1.23", features = ["platform"] }
cacp = { version = "0.1.2", default-features = false }
cacp-agents = "0.1.0"
chrono = "0.4"
dirs = "6"
editor = { version = "0.1.23", package = "bezel-editor" }
futures = "0.3"
global-hotkey = "0.8"
image = "0.25"
lru = "0.18"
markdown = { version = "0.1.23", package = "bezel-markdown" }
mcp = { version = "0.1.12", path = "crates/mcp", package = "cydonia-mcp" }
notify = "8"
portable-pty = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syntax = { version = "0.1.23", package = "bezel-syntax", features = ["wasm"] }
prompts = { version = "0.1.12", path = "crates/prompts", package = "cydonia-prompts" }
terminal = { version = "0.1.23", package = "bezel-terminal" }
tokio = { version = "1", features = ["net", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
toml_edit = "0.22"
ureq = "3"
url = { version = "2", features = ["serde"] }

[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"

[patch.crates-io]
bezel = { path = "../bezel/crates/bezel" }
bezel-editor = { path = "../bezel/crates/editor" }
bezel-markdown = { path = "../bezel/crates/markdown" }
bezel-syntax = { path = "../bezel/crates/syntax" }
bezel-terminal = { path = "../bezel/crates/terminal" }
