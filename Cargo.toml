[workspace]
members = ["crates/cydonia", "crates/artifact", "crates/mcp"]
resolver = "3"

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/crabtalk/cydonia"
homepage = "https://cydonia.sh"

# What ships: the release profile, wound down to size rather than speed, and the
# only profile that compiles out the Developer section — see
# `crates/cydonia/build.rs`. `make release` builds it; `make bundle` stays on
# `release`, so a local bundle still carries the switches worth looking at.
[profile.prod]
inherits = "release"
# `z` over `s`: no loop vectorisation either, which is the rest of what a binary
# this size spends its pages on. A desktop app is waiting on the person using it
# far more than on itself, and nothing in the frame path here is a hot numeric
# loop — the one cost that would show is gpui's, and it is not in this crate.
opt-level = "z"
# One unit and a whole-program pass: inlining across crate lines is where most
# of the size goes, and a release is built once.
lto = "fat"
codegen-units = 1
# The bundle carries no dSYM and nothing reads a backtrace off a shipped build,
# so the table is a third of the binary for nobody.
strip = "symbols"

[workspace.dependencies]
artifact = { version = "0.1.3", path = "crates/artifact", package = "cydonia-artifact" }
anyhow = "1"
axum = "0.8"
bezel = { version = "0.1.11", features = ["platform"] }
cacp = { version = "0.1.0", default-features = false }
cacp-agents = "0.1.0"
dirs = "6"
editor = { version = "0.1.11", package = "bezel-editor" }
futures = "0.3"
image = "0.25"
lru = "0.18"
markdown = { version = "0.1.11", package = "bezel-markdown" }
mcp = { version = "0.1.3", path = "crates/mcp", package = "cydonia-mcp" }
notify = "8"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntax = { version = "0.1.11", package = "bezel-syntax" }
tokio = { version = "1", features = ["net", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
toml_edit = "0.22"
ureq = "3"
url = { version = "2", features = ["serde"] }
