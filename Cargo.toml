[workspace]
members = ["crates/cydonia", "crates/artifact", "crates/mcp"]
resolver = "3"

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/crabtalk/cydonia"
homepage = "https://cydonia.sh"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"

[workspace.dependencies]
artifact = { version = "0.1.4", path = "crates/artifact", package = "cydonia-artifact" }
anyhow = "1"
axum = "0.8"
bezel = { version = "0.1.13", features = ["platform"] }
cacp = { version = "0.1.0", default-features = false }
cacp-agents = "0.1.0"
dirs = "6"
editor = { version = "0.1.13", package = "bezel-editor" }
futures = "0.3"
global-hotkey = "0.8"
image = "0.25"
lru = "0.18"
markdown = { version = "0.1.13", package = "bezel-markdown" }
mcp = { version = "0.1.4", path = "crates/mcp", package = "cydonia-mcp" }
notify = "8"
portable-pty = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntax = { version = "0.1.13", package = "bezel-syntax" }
terminal = { version = "0.1.13", package = "bezel-terminal" }
tokio = { version = "1", features = ["net", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
toml_edit = "0.22"
ureq = "3"
url = { version = "2", features = ["serde"] }

# bezel and cydonia are worked on together, so the sibling checkout stands in
# for every bezel crate the registry would serve — a change over there is in
# this window's next build, with no version to bump between them. The facade's
# own dependencies are path dependencies inside that workspace, so `ui`,
# `theme`, `motion` and the rest follow without being named here. Drop this
# block to build against the published crates.
[patch.crates-io]
bezel = { path = "../bezel/crates/bezel" }
bezel-editor = { path = "../bezel/crates/editor" }
bezel-markdown = { path = "../bezel/crates/markdown" }
bezel-syntax = { path = "../bezel/crates/syntax" }
bezel-terminal = { path = "../bezel/crates/terminal" }
