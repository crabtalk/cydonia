[package]
name = "cydonia-acp-interop"
description = "Runs cydonia-acp against the reference implementation, both roles"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dev-dependencies]
agent-client-protocol = { version = "2", features = ["unstable"] }
acp = { workspace = true, features = ["client", "server"] }
futures = "0.3.34"
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
