[package]
name = "cydonia-acp-events"
description = "A channel-based ACP client for cydonia-acp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["acp", "agent", "protocol", "client", "async"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
cydonia-acp = { workspace = true, features = ["client"] }
cydonia-acp-proto.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread"] }
