[package]
name = "cydonia-acp"
description = "A compact implementation of the Agent Client Protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["acp", "agent", "protocol", "jsonrpc", "ai"]
categories = ["api-bindings", "asynchronous", "network-programming"]

[features]
default = ["client", "server"]
# `spawn` runs the agent as a subprocess; `serve_on_stdio` reads the agent's own.
client = ["tokio/process"]
server = ["tokio/io-std"]

[dependencies]
acp-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "rt", "sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "time"] }
