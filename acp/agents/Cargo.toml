[package]
name = "cydonia-acp-agents"
description = "Find, install, and run ACP agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["acp", "agent", "registry", "install", "ai"]
categories = ["api-bindings", "development-tools"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
which = { workspace = true, optional = true }

[features]
default = ["install"]
# Fetching the catalogs, and putting agents and MCP servers on disk: the
# network, `npm`, and processes. Off, what is left is the catalogs' types and
# parsers, which build for wasm32.
install = ["dep:sha2", "dep:ureq", "dep:which"]
