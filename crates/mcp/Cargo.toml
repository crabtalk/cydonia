[package]
name = "cydonia-mcp"
description = "The MCP server cydonia answers as: the tools an agent works a project through"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["mcp", "agents", "tools", "cydonia"]
categories = ["development-tools"]

[dependencies]
artifact.workspace = true
axum = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
prompts.workspace = true
regex.workspace = true
tokio = { workspace = true, optional = true }

[features]
default = ["http"]
# The server over HTTP. Off, the tools, the protocol and the rail build for
# wasm32.
http = ["artifact/sqlite", "dep:axum", "dep:tokio"]
