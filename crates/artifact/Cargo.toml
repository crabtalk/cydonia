[package]
name = "cydonia-artifact"
description = "The artifacts cydonia keeps and answers with: articles, boards, sessions, tables"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["acp", "agents", "artifacts", "cydonia"]
categories = ["data-structures"]

[features]
default = ["sqlite"]
fs = ["dep:dirs", "dep:manifest", "dep:notify", "dep:web-time"]
sqlite = ["fs", "dep:rusqlite"]
pictures = ["fs", "dep:image"]

[dependencies]
anyhow.workspace = true
canvas.workspace = true
notify = { workspace = true, optional = true }
pulldown-cmark.workspace = true
regex.workspace = true
rusqlite = { workspace = true, optional = true }
cydonia-acp.workspace = true
dirs = { workspace = true, optional = true }
image = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar.workspace = true
thiserror.workspace = true
manifest = { workspace = true, optional = true, features = ["cargo"] }
toml.workspace = true
toml_edit.workspace = true
url.workspace = true
web-time = { workspace = true, optional = true }
