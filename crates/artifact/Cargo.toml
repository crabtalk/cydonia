[package]
name = "cydonia-artifact"
description = "The artifacts cydonia keeps and answers with: articles, boards, sessions, tables"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["acp", "agents", "artifacts", "cydonia"]
categories = ["data-structures"]

[features]
default = ["sqlite"]
# The filesystem backend's project numbers (`state.db`) and the catalog's
# tables (`data.db`). Off, the crate links for wasm32; the filesystem backend
# then has no numbers to give.
sqlite = ["dep:rusqlite"]
# Importing a cover: decoding a picture and resampling it to `cover::WIDTH`.
pictures = ["dep:image"]

[dependencies]
anyhow.workspace = true
notify.workspace = true
pulldown-cmark.workspace = true
regex.workspace = true
rusqlite = { workspace = true, optional = true }
acp.workspace = true
dirs.workspace = true
image = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar.workspace = true
thiserror.workspace = true
manifest = { workspace = true, features = ["cargo"] }
toml.workspace = true
toml_edit.workspace = true
url.workspace = true
web-time.workspace = true
