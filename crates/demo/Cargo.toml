[package]
name = "cydonia-demo"
description = "Cydonia in a browser tab, on a project held in memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_family = "wasm")'.dependencies]
artifact.workspace = true
bezel.workspace = true
console_error_panic_hook = "0.1"
gpui_web = { version = "0.3.12", package = "bezel-gpui-web" }
gui.workspace = true
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "Element", "Window"] }

[build-dependencies]
syntax.workspace = true
syntax-std = { version = "0.2.0", package = "bezel-syntax-std" }
