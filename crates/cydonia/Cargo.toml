[package]
name = "cydonia"
description = "Desktop workspace for the ACP agents you run, keeping what they produce as files on your disk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["acp", "agents", "desktop", "gpui", "workspace"]
categories = ["gui", "development-tools"]

[[bin]]
name = "cydonia"
path = "bin/main.rs"

[dependencies]
anyhow.workspace = true
bezel = { workspace = true, features = ["platform"] }
gui.workspace = true
markdown.workspace = true

[build-dependencies]
embed-resource = "3"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }

[features]
# Lists the Developer section in settings — see `cydonia-gui`.
developer = ["gui/developer"]
