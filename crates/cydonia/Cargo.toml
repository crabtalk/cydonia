[package]
name = "cydonia"
description = "Desktop workspace for the ACP agents you run, keeping what they produce as files on your disk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["acp", "agents", "desktop", "gpui", "workspace"]
categories = ["gui", "development-tools"]

[[bin]]
name = "cydonia"
path = "bin/main.rs"

[dependencies]
artifact.workspace = true
anyhow.workspace = true
bezel.workspace = true
cacp = { workspace = true, features = ["client"] }
cacp-agents.workspace = true
dirs.workspace = true
editor.workspace = true
futures.workspace = true
image.workspace = true
lru.workspace = true
markdown.workspace = true
mcp.workspace = true
notify.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
syntax.workspace = true
tokio.workspace = true
toml.workspace = true
toml_edit.workspace = true
ureq.workspace = true
url.workspace = true

# The workspace root's release profile, written a second time because a
# published crate is the root of its own workspace and the root manifest is not
# published — so this is the table `cargo install cydonia` builds with, and
# without it an installed binary is the one cargo's defaults produce. Cargo
# warns that a member's profiles are ignored; here they are, on every local
# command, and the root's copy is what answers for those.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
