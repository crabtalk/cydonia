[package]
name = "cydonia"
description = "Desktop workspace for the ACP agents you run, keeping what they produce as files on your disk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["acp", "agents", "desktop", "gpui", "workspace"]
categories = ["gui", "development-tools"]

[[bin]]
name = "cydonia"
path = "bin/main.rs"

[dependencies]
artifact.workspace = true
anyhow.workspace = true
base64.workspace = true
bezel.workspace = true
cacp = { workspace = true, features = ["client"] }
cacp-agents.workspace = true
chrono.workspace = true
dirs.workspace = true
editor.workspace = true
futures.workspace = true
global-hotkey.workspace = true
image.workspace = true
lru.workspace = true
markdown.workspace = true
mcp.workspace = true
notify.workspace = true
portable-pty.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
syntax.workspace = true
prompts.workspace = true
terminal.workspace = true
tokio.workspace = true
toml.workspace = true
toml_edit.workspace = true
ureq.workspace = true
url.workspace = true

[dev-dependencies]
syntax-std = { version = "0.1.18", package = "bezel-syntax-std" }
gpui = { version = "0.3.10", package = "bezel-gpui", features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Headless UI tests do not require the Metal compiler toolchain.
gpui_platform = { version = "0.3.10", package = "bezel-gpui-platform", features = ["runtime_shaders"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
