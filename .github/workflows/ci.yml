name: ci

# Pull requests only. A merge to `main` runs `nightly.yml`, which builds every
# platform in release.
on:
  pull_request:

# A second push to the same branch cancels the first: only the tip matters.
# Keyed on the source branch, since a pull request's own ref is not it.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # sccache keys on the compilation itself, so the two jobs below share what
  # they build of the dependency tree instead of each warming a cache of its
  # own. It cannot cache incremental artefacts, and cargo's incremental mode
  # would route around it, so that is off.
  CARGO_INCREMENTAL: 0
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: mozilla-actions/sccache-action@v0.0.11
      # Ahead of the apt install: formatting needs no system library, and a
      # failure here should report in seconds rather than after a package fetch.
      - run: cargo fmt --all --check
      # clippy runs build scripts, and those probe for the libraries below.
      - run: sudo .github/scripts/linux-deps
      - run: cargo clippy --workspace --all-targets

  # Every platform but macOS, which is built on the machines cydonia is
  # developed on. 22.04 sets the glibc floor of a Linux build.
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-22.04 }
          - { name: linux-aarch64, os: ubuntu-22.04-arm }
          - { name: windows-x86_64, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      - if: runner.os == 'Linux'
        run: sudo .github/scripts/linux-deps
      - run: cargo build --bin cydonia
